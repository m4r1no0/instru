name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/oc')) ||
      (github.event_name == 'pull_request_review_comment' && startsWith(github.event.comment.body, '/oc'))

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OpenCode
        id: opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/gpt-5-codex
          prompt: ${{ github.event.comment.body }}

      - name: Comment response on Issue/PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `${{ steps.opencode.outputs.response || steps.opencode.outputs.result || 'No response returned' }}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🤖 **OpenCode response:**\n\n${output}`
            });